<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Shello analyzer — feedback dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #231f20; }
    h1 { font-size: 1.3rem; }
    h2 { font-size: 1rem; margin-top: 2rem; }
    table { border-collapse: collapse; margin-top: .5rem; font-size: .85rem; }
    th, td { border: 1px solid #ccc; padding: .3rem .6rem; text-align: left; }
    input[type=password] { padding: .4rem; min-width: 20rem; }
    button { padding: .4rem .9rem; cursor: pointer; }
    .muted { color: #666; font-size: .8rem; }
    #err { color: #b00; margin-top: .5rem; }
  </style>
</head>
<body>
  <h1>Shello analyzer — anonymous feedback</h1>
  <div id="auth">
    <p class="muted">Dashboard token (kept in sessionStorage only):</p>
    <input type="password" id="token" autocomplete="off" />
    <button id="btn-load">Load</button>
    <span id="err"></span>
  </div>
  <div id="dash" hidden>
    <p class="muted" id="summary"></p>
    <button id="btn-csv">Download CSV</button>
    <div id="tables"></div>
  </div>
  <script src="js/dashboard.js"></script>
</body>
</html>
